[build]
  command = "npm run build"
  publish = "dist"
  # The repo holds more than one client site. This skips the build when the
  # push did not touch this folder, so a Revelectrical commit does not rebuild
  # DetailSplash. Exit 0 means skip, so the sense reads backwards.
  #
  # The INCOMING_HOOK_TITLE guard matters: a build hook fires on the same
  # commit as the last one, so the diff is empty and a content publish from
  # the Studio would otherwise be skipped and never reach the site.
  ignore = '[ -z "$INCOMING_HOOK_TITLE" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- .'

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    # No third-party scripts run on this site, so script-src can stay at 'self'
    # with no 'unsafe-inline'. Astro bundles component scripts to files rather
    # than inlining them, which is what makes that possible.
    #
    # style-src needs 'unsafe-inline' because the hero, service-area map and
    # booking panel set their background image through a style attribute, and
    # CSP treats inline style attributes as unsafe-inline.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.sanity.io; connect-src 'self' https://cdn.sanity.io; upgrade-insecure-requests"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/thank-you/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
