# DUNK client onboarding forms.
# One site serves every client. The client is identified by query params on the
# link we send them, so there is nothing to rebuild when we onboard someone new.

[build]
  publish = "public"

# The form posts to /thank-you. Netlify's pretty URLs resolve that to
# /thank-you.html on its own, but being explicit survives a settings change.
[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
