[build]
  base = "dunk-site"
  command = "npm run build"
  publish = "dist"
  # The repo holds more than one client site. This skips the build when the
  # push did not touch this folder. Exit 0 means skip, so the sense reads
  # backwards.
  ignore = 'git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- .'

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    # No third-party scripts run yet, so script-src stays at 'self'. The nav
    # script is served from /js/site.js rather than inlined, which is what
    # makes that possible. Adding Google Tag Manager later means adding
    # 'unsafe-inline' here, the way Revelectrical has to.
    #
    # style-src needs 'unsafe-inline' because several sections set their
    # background image through a style attribute, and CSP counts an inline
    # style attribute as unsafe-inline.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src 'self' https://fonts.gstatic.com https://cdn.fontshare.com; img-src 'self' data:; connect-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
